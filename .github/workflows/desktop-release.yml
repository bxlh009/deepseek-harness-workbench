name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches desktop version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          if ('${{ github.ref_name }}' -ne "desktop-v$version") {
            throw "Tag ${{ github.ref_name }} does not match desktop-v$version"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries and web application
        run: pnpm run build

      - name: Assemble archived desktop runtime
        run: pnpm run desktop:package

      - name: Test desktop updater and launcher
        working-directory: apps/desktop
        run: pnpm test

      - name: Build installer and update metadata
        working-directory: apps/desktop
        run: .\node_modules\.bin\electron-builder.CMD --win nsis --publish never

      - name: Smoke-test installed FreeLLMAPI resources
        shell: pwsh
        run: |
          $resources = Resolve-Path 'dist/desktop/artifacts/win-unpacked/resources'
          $dataDirectory = Join-Path '${{ runner.temp }}' 'freellmapi-installed-smoke'
          & "$resources/runtime.asar.unpacked/node.exe" `
            'apps/desktop/test/smoke-installed-freellmapi-runtime.mjs' `
            $resources `
            $dataDirectory

      - name: Publish one deterministic GitHub Release
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $releaseTag = "v$version"
          $artifactRoot = 'dist/desktop/artifacts'
          $artifacts = @(
            "$artifactRoot/DeepSeek-Harness-Workbench-$version-x64-setup.exe",
            "$artifactRoot/DeepSeek-Harness-Workbench-$version-x64-setup.exe.blockmap",
            "$artifactRoot/latest.yml"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Missing release artifact: $artifact"
            }
          }
          if (gh release view $releaseTag --repo '${{ github.repository }}' 2>$null) {
            gh release upload $releaseTag $artifacts --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $releaseTag $artifacts `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "DeepSeek Harness Workbench $version" `
              --notes "Global, local-first desktop coding agent built on the open-source DeepSeek Harness. This release adds English-first core surfaces with Chinese support, multiple model providers, local workspaces, plugins, approvals, and user-controlled in-app updates." `
              --latest
          }
